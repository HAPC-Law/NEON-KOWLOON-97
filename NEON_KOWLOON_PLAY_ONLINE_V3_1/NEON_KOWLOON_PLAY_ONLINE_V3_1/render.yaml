services:
  - type: web
    name: neon-kowloon-97
    runtime: docker
    rootDir: NEON_KOWLOON_PLAY_ONLINE_V3_1
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ALLOW_GUESTS
        value: "1"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
